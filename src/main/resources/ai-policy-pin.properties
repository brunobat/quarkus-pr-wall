# The upstream policy this agent paraphrases, pinned to the revision it was read at.
#
# The 'content_disproportionate' question in questions/triage.json restates one section of this file
# in its own words. If upstream edits that section, the question's criteria silently stop matching the
# policy they claim to enforce and nothing in the build notices -- the instructions still read fine.
# AiPolicyDriftTest fetches the blob SHA and fails when it moves.
#
# The upstream file is authoritative and this one is not. A failure means "re-read the policy and
# re-pin", never "the policy is wrong".
#
# The paraphrase is deliberately NARROWER than the section it restates, and a re-pin must preserve
# that. Upstream's test is a counterfactual -- the PR should resemble "what the developer would have
# come up with had they not been using AI tools" -- which cannot be asked of a model without inferring
# tooling from style. That is stylometry and design section 9 rules it out. The question therefore asks
# only the observable half: is the content out of proportion to the change, whatever produced it. Do
# not close that gap when re-pinning; closing it would turn a proportionality check into an
# AI-detection one, which is both unsupported and the thing I-7 exists to prevent.
#
# Known limitation: the blob SHA moves for a typo fix as readily as for a rewrite, so this detects
# drift, not meaningful drift. That is the right direction to be wrong in -- a false alarm costs one
# read of a short file.

ai-policy.repo=quarkusio/quarkus
ai-policy.path=AI_POLICY.md
ai-policy.blob-sha=2fe8a3c9f97a1f00518d3205901792db5c03cc90
ai-policy.commit-sha=413a4d2e9ecd8acd9c81e3c79308574eb14d7182
ai-policy.section=Signal-to-Noise Ratio
ai-policy.read-on=2026-10-21
