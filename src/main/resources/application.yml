# Quarkus PR Review Agent configuration (plan §11).
# Secrets come from the environment; nothing sensitive is committed. The gh credential is read-only,
# least-privilege (design §8) — the primary prompt-injection mitigation.
quarkus:
  banner:
    enabled: false
  log:
    # stdout carries the markdown report and nothing else, so `review <pr> > report.md` is a clean
    # file. Every log line, including third-party startup noise, goes to stderr.
    console:
      stderr: true
    category:
      "io.quarkus.prreview":
        level: INFO
  native:
    # The tuning surface and question sets are read from the classpath at runtime, so they must be
    # embedded in the native image explicitly (plan §12 phase 6).
    resources:
      includes: questions/*.json,rules/*.yaml,rules/rulesets.txt,security-signals.txt,messages.properties
  rest-client:
    jev:
      url: ${JEV_URL:https://api.typesafe.ai}
      connect-timeout: 5000
      read-timeout: 30000
    anthropic:
      url: ${ANTHROPIC_URL:https://api.anthropic.com}
      connect-timeout: 5000
      read-timeout: 60000

# TypeSafe jev (all structured decisions) — plan §2.
jev:
  api-key: ${TYPESAFE_API_KEY:}
  model: ${JEV_MODEL:jev-latest}

# Anthropic Opus (narrow prose generation only) — plan §9.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}
  version: "2023-06-01"
  max-tokens: 512
  # State compaction (§9.4) needs far more room than a one-line fix suggestion.
  compaction-max-tokens: 2048

# Dependency health probes (plan §12 phase 1) — the `health` subcommand.
health:
  timeout-seconds: 20

# Read-only gh access (design §3.1, §8).
gh:
  binary: ${GH_BINARY:gh}
  repo: ${GH_REPO:}
  timeout-seconds: 60

# The I-1 content signal list. The bundled resources/security-signals.txt is a public, deliberately
# generic default; point this at a private file to keep the real list off the public surface (§11).
security:
  signals-file: ${SECURITY_SIGNALS_FILE:}

# Pinned governance file for committer-status (design §3.1).
committers:
  file: COMMITTERS.adoc

# A base branch matching this is treated as a maintenance/LTS backport target (plan §5.4c).
backport:
  branch-regex: "^(?!main$|master$|develop$).*(\\d+\\.\\d+.*|\\.x)$"
