# Application settings (and their environment variables) are declared in ReviewConfig.
quarkus:
  banner:
    enabled: false
  log:
    console:
      # stdout carries only the result; all logs go to stderr.
      stderr: true
  langchain4j:
    typesafe:
      # "not-set" means no key: the run stops before any PR with an error naming TYPESAFE_API_KEY. Left empty, the
      # extension would fail at startup with a message that names only its own property, even for --help.
      api-key: ${TYPESAFE_API_KEY:not-set}
      base-url: ${JEV_URL:https://api.typesafe.ai}
      timeout: ${JEV_TIMEOUT:60s}
      decision-model:
        model-name: ${JEV_MODEL:jev-latest}
    anthropic:
      # "not-set" means no key: the summary then uses the fallback template without calling Claude. Not the
      # extension's own "dummy", which makes startup fail once an AI service exists.
      api-key: ${ANTHROPIC_API_KEY:not-set}
      timeout: ${ANTHROPIC_TIMEOUT:60s}
      chat-model:
        model-name: ${ANTHROPIC_MODEL:claude-opus-5-5}

"%test":
  quarkus:
    langchain4j:
      typesafe:
        api-key: test-key
      anthropic:
        api-key: test-key
        # A test points this at its Claude stub with claude-stub.base-url. Without one, nothing listens on port 1,
        # so a test that forgets the stub fails to connect instead of calling Anthropic.
        base-url: ${claude-stub.base-url:http://localhost:1/v1/}
