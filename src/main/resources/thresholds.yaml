# Named confidence / scoring dials (plan §5.6, §6, §11).
# Every number the ruleset relies on lives here, referenced by name — never inlined in a rule —
# so re-tuning is a one-file, reviewable, git-bisectable diff. Loaded into interpret.Thresholds.
version: thresholds-v1

# Choice/Score confidence bands (§6).
confirmBand: 0.90
flagBand: 0.50

# Noul bands, expressed in terms of the returned noul (= P(yes)); confidence is derived as |2p-1|.
noulConfirmYes: 0.95
noulConfirmNo: 0.05
noulFlagYesLow: 0.75
noulFlagNoHigh: 0.25

# Additional integer dials referenced by name from rules.
named:
  adequateScore: 3        # test_adequacy >= this at CONFIRM => confidently adequate tests
  happyOnlyScore: 2       # test_adequacy == this => happy-path-only FYI
  highExposure: 3         # api_exposure >= this => public/SPI surface, high-stakes confirm
  blastRadiusFloor: 2     # a sub-CONFIRM change_kind/blast_radius floors blast-radius here (I-5)
  priorityFloor: 2        # the §5 "read closely" security floor (I-1) and anomaly ceiling (I-2)
  escalatePriority: 1     # a reserved deep pipeline nudges review-priority to at least this
