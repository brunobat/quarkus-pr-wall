# Message catalog (plan §5.6, design §10). Maps a rule's message key to a stable, deterministic
# one-line summary that evals assert against. Opus later renders human-facing fix prose from the same
# finding, but these summaries never depend on a model, so the eval suite is drift-proof.

# Test-adequacy
test-missing=Runtime behavior changes with no accompanying or located test.
test-disabled=Tests for the changed behavior exist but are disabled.
test-vacuous=Tests exist but assert nothing about the changed behavior.
test-covered-by-existing=Change appears covered by an existing untouched test; confirm it exercises the change.
test-happy-path-only=Only the happy path is asserted; edge cases are optional here.

# Breaking-change
breaking-change-backported=A breaking change is backported to a maintenance/LTS branch.
breaking-change-no-migration=A breaking change ships without a migration note.
breaking-change-documented=A documented breaking change on the main branch.
breaking-change-possible=A possible breaking change — confirm and document it.

# Deep pipeline test-adequacy — test adequacy (confirmation pass)
test-adequacy-weak=Test coverage is weak — only the happy path is verified.
test-possibly-vacuous=The accompanying tests may be vacuous; confirm they assert the change.

# Deep pipelines test-adequacy + exempt-class — the exempt-class coupling (plan §7 exempt-class)
test-exempt=The test requirement is waived — the change matches an exempt class.

# Deep pipeline test-weakening
tests-weakened=Existing test coverage is weakened alongside a runtime behavior change.
tests-weakened-refactor=Existing coverage is weakened in a refactor; confirm no coverage is lost.

# Deep pipeline docs-missing
docs-missing=New config/feature/public API without corresponding docs.

# Deep pipeline domain-routing — domain-expert routing
domain-expert-security=A security reviewer should see this change.
domain-expert-messaging=A messaging domain expert should see this change.
domain-expert-persistence=A persistence domain expert should see this change.
domain-expert-native=A native-image domain expert should see this change.

# Deep pipeline inconsistency
inconsistency=The PR description does not match the diff.
inconsistency-undisclosed=The diff contains a material change the PR description omits.
